name: Build and deploy Node.js app to Azure Web App - app-safe-ride-prd-001

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mongo: 
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })' || exit 1"
          --health-interval=5s --health-timeout=5s --health-retries=5

    env:
      NODE_ENV: test
      # Point tests to local Mongo service and disable forcing TLS in tests
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      BLOB_STORAGE_CONNECTION_STRING: ${{ secrets.BLOB_STORAGE_CONNECTION_STRING }}
      COSMOS_CONNECTION_STRING: ${{ secrets.COSMOS_CONNECTION_STRING }}
      COSMOS_DATABASE: ${{ secrets.COSMOS_DATABASE }}
      BLOB_CONTAINER_PROFILE: ${{ secrets.BLOB_CONTAINER_PROFILE }}
      BLOB_CONTAINER_VEHICLE: ${{ secrets.BLOB_CONTAINER_VEHICLE}}
      ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
      ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
      ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
      ENTRA_REDIRECT_URI: ${{ secrets.ENTRA_REDIRECT_URI}}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
      KEY_VAULT_URL: ${{ secrets.KEY_VAULT_URL }}
      RATE_LIMIT_WINDOW_MS: ${{ secrets.RATE_LIMIT_WINDOW_MS }}
      RATE_LIMIT_MAX_REQUESTS: ${{ secrets.RATE_LIMIT_MAX_REQUESTS }}
      COSMOS_TLS: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Wait for Mongo
        run: |
          curl -s https://raw.githubusercontent.com/vishnubob/wait-for-it/master/wait-for-it.sh -o wait-for-it.sh
          chmod +x wait-for-it.sh
          ./wait-for-it.sh localhost:27017 -t 120

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present

      - name: Zip artifact for deployment
        run: zip -r release.zip . -x@.zipignore

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write # Required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F9C8E7D6A5B4C3D2E1F0A9B8C7D6E5F4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1A2B3C4D5E6F7G8H9I0J1K2L3M4N5O6P }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2B3C4D5E6F7G8H9I0J1K2L3M4N5O6P7Q }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-safe-ride-prd-001'
          slot-name: 'Production'
          package: .
