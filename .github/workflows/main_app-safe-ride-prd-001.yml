name: Build and deploy Node.js app to Azure Web App - app-safe-ride-prd-001

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })' || exit 1"
          --health-interval=5s --health-timeout=5s --health-retries=5

    env:
      NODE_ENV: test
      # Point tests to local Mongo service and disable forcing TLS in tests
      COSMOS_CONNECTION_STRING: mongodb://localhost:27017
      COSMOS_TLS: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Wait for MongoDB to become available
        run: |
          echo "Waiting for MongoDB..."
          for i in $(seq 1 30); do
            if nc -z localhost 27017; then
              echo "Mongo OK"
              exit 0
            fi
            sleep 1
          done
          echo "Mongo did not come up in time" && exit 1

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .
