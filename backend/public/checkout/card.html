<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SafeRide · Pago con tarjeta</title>
  <!--
    Formulario de tarjeta de SafeRide. Los cuatro campos (número, titular,
    caducidad y CVC) son iframes de PayPal Card Fields: la página solo los
    posiciona y les da estilo. Los datos de la tarjeta viajan directo a PayPal
    y nunca pasan por la app ni por el backend de SafeRide.
    Parámetros: orderId (orden ya creada en /paypal/create-order), crc y usd
    (montos a mostrar). Comunica el resultado a la app con postMessage.
  -->
  <style>
    /* Tokens de SafeRide (mismos que DriverThemeContext de la app). */
    :root {
      --bg: #F2F2F7;
      --surface: #FFFFFF;
      --border: #E5E5EA;
      --stripe: #1C1C1E;
      --text: #1C1C1E;
      --muted: #636366;
      --line: #D1D1D6;
      --accent: #4B68FF;
      --error: #C4261D;
      --cta: #4B68FF;
      --cta-text: #FFFFFF;
    }
    :root[data-theme="dark"] {
      --bg: #000000;
      --surface: #121212;
      --border: #333333;
      --stripe: #2C2C2E;
      --text: #FFFFFF;
      --muted: #A0A0A0;
      --line: #3A3A3C;
      --accent: #276EF1;
      --error: #FF8A84;
      --cta: #276EF1;
      --cta-text: #FFFFFF;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font-family: Poppins, -apple-system, Roboto, "Segoe UI", sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 16px 16px 32px; }
    .amount { text-align: center; margin: 8px 0 20px; }
    .amount .crc { font-size: 30px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
    .amount .usd { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px 20px 20px; }
    .card + .card { margin-top: 12px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .field .slot { min-height: 44px; border-bottom: 1px solid var(--line); }
    .field:focus-within .slot { border-bottom: 2px solid var(--accent); }
    .field.has-error .slot { border-bottom-color: var(--error); }
    .row { display: flex; gap: 20px; margin-top: 22px; }
    .row .grow { flex: 1; }
    .row .expiry { width: 110px; }
    .back { padding: 0 0 20px; overflow: hidden; }
    .back .stripe { height: 38px; background: var(--stripe); margin: 28px 0 18px; }
    .back .cvc { width: 90px; margin-left: auto; margin-right: 20px; }
    .secure { display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 13px; color: var(--muted); margin: 18px 0 14px; }
    .secure svg { width: 16px; height: 16px; fill: var(--accent); }
    button { width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: var(--cta);
      color: var(--cta-text); font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; color: var(--error); }
    .state { text-align: center; padding: 48px 8px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="amount" id="amount" hidden>
      <div class="crc" id="crc"></div>
      <div class="usd" id="usd"></div>
    </div>

    <div id="form" hidden>
      <div class="card">
        <div class="field" id="f-number">
          <label>Número de tarjeta</label>
          <div class="slot" id="card-number"></div>
        </div>
        <div class="row">
          <div class="field grow" id="f-name">
            <label>Nombre del titular de la tarjeta</label>
            <div class="slot" id="card-name"></div>
          </div>
          <div class="field expiry" id="f-expiry">
            <label>Fecha de caducidad</label>
            <div class="slot" id="card-expiry"></div>
          </div>
        </div>
      </div>

      <div class="card back">
        <div class="stripe"></div>
        <div class="field cvc" id="f-cvv">
          <label>CVC</label>
          <div class="slot" id="card-cvv"></div>
        </div>
      </div>

      <div class="secure">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V11a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3H9z"/></svg>
        Tu pago es seguro
      </div>
      <button id="pay" type="button" disabled>Pagar</button>
      <div class="msg" id="msg" role="alert" aria-live="polite"></div>
    </div>

    <div class="state" id="state">Cargando formulario seguro…</div>
  </main>

  <script src="card.js"></script>
</body>
</html>
